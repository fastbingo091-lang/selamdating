name: selamdating

services:
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: goferbet
      DB_USER: goferbet
      DB_PASS: ${DB_PASS:-goferbet-local}
      PORT: "10000"
    ports:
      - "${APP_PORT:-8080}:10000"
    volumes:
      - uploads:/var/www/html/assets/uploads

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: goferbet
      MARIADB_USER: goferbet
      MARIADB_PASSWORD: ${DB_PASS:-goferbet-local}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-goferbet-root-local}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data:
  uploads:
